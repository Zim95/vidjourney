# Only keys actually read by live code are kept. Removed sections that fed the
# retired DSL/timeline/manim-runner pipeline ([icons], [scenes], [render]) and
# the dead canvas/list/concept-card/entity layout knobs under [grouping].

[pipeline]
# Shared executor pools — bound total concurrency across all stages.
# thread_workers: I/O-bound (Ollama, manim/ffmpeg/piper subprocess, YouTube)
# process_workers: CPU-bound (PDF parsing, rendering)
thread_workers = 4
process_workers = 4

[manim]
# scroll render shells out to manim with this interpreter
python = .venv/bin/python

[ingestion]
max_workers = 4
# Table detection thresholds for per-document tuning
table_y_tolerance = 3.0
table_x_cluster_tolerance = 8.0
table_row_spacing_variance = 2.5
table_width_ratio = 0.75
table_score_threshold = 3.0

# Code detection thresholds for per-document tuning
code_sql_keyword_hits = 4
code_symbol_density_min = 0.015
code_symbol_density_strong = 0.03
code_min_line_count = 3
code_demote_symbol_density = 0.02
code_demote_sql_hits = 2
code_prose_min_line_length = 8
code_prose_connector_keywords = which,because,therefore,works,calculate,efficiently,load,find

# Code block rendering
code_blocks_dir = pipeline/sections/resources/code_blocks
code_block_images_dir = pipeline/sections/resources/code_block_images
code_block_font_size = 16
code_block_line_numbers = false
code_block_style = monokai
code_block_image_pad = 20

[grouping]
sections_dir = pipeline/sections
content_groups_dir = pipeline/groups/content_groups

# Narration (Piper TTS)
piper_model = /Users/namahshrestha/.local/share/piper-voices/en_US-lessac-medium.onnx
piper_speaker_id = 0
piper_length_scale = 1.0
narration_dir = pipeline/groups/narration
output_dir = pipeline/output

# Part packaging — consecutive section mp4s combine into "Part" videos named
# "<book_title> - Part <n> - <Summary>.mp4".
book_title = Designing Data-Intensive Applications
part_min_duration_minutes = 10.0

[ollama]
# Chat model — only used for the optional part-title generator
base_url = http://localhost:11434
chat_model = gemma4:e2b
max_retries = 3

[ml]
# Ollama embeddings endpoint + model for the code-detection classifier
ollama_url = http://localhost:11434/api/embeddings
embedding_model = nomic-embed-text
embedding_batch_size = 50

# Model training / inference
models_dir = models
model_filename = code_rf.joblib
training_data_dir = src/ingestion/ml/training_code_snippets
n_estimators = 200
test_size = 0.2
random_state = 42
code_line_threshold = 0.4

[youtube]
# --- OAuth credentials (fill these in) ---------------------------------
# 1. Google Cloud Console → enable "YouTube Data API v3".
# 2. Create an OAuth client ID of type "Desktop app", download the JSON.
# 3. Point client_secrets_file at it. token_file is written after the first
#    browser sign-in and reused (refresh token), so you authorize once.
client_secrets_file = client.secret.json
token_file = .youtube_token.json

# Where parts + their paste-ready descriptions live.
parts_dir = pipeline/scroll/parts
descriptions_dir = pipeline/descriptions
# Ledger {part -> videoId}; prevents re-uploading on rerun.
upload_state_file = pipeline/descriptions/upload_state.json

# --- Playlist ----------------------------------------------------------
# If playlist_id is set, every uploaded part is added to that existing
# playlist. If blank, a new playlist titled playlist_title is created on the
# first run and its id is cached in the ledger, so the daily --limit batches
# all add to the SAME playlist instead of creating a new one each run.
# Accepts a raw id (PLxxxx) or a full playlist URL.
playlist_id = PL3yTDI3ftw29fEc6BnZsZKJqxjUcgFjWO
playlist_title = Designing Data Intensive Applications (DDIA)
playlist_privacy = public

# --- Thumbnail ---------------------------------------------------------
# Custom thumbnail applied to every uploaded video. JPG/PNG, < 2 MB, 1280x720
# (16:9) recommended. Requires a phone-verified channel. Blank = skip.
thumbnail_file = images/ddia_thumbnail_16x9.png

# --- Scheduling (buffer so we don't dump everything at once) -----------
# part i publishes on (start_date + i * publish_interval_days) at publish_time.
# interval_days = 0 → every part publishes on the SAME day (start_date). The
# whole series is launching together on 2026-07-04.
publish_start_date = 2026-07-04
publish_time = 10:00
publish_timezone = UTC
publish_interval_days = 0
# Go-live privacy at publishAt: public | unlisted (private+publishAt = scheduled)
publish_privacy_status = public

# --- Pacing (one upload at a time; look human, don't hammer) -----------
upload_delay_seconds = 300
upload_chunk_size = 5242880
upload_max_retries = 5
category_id = 27
default_language = en
made_for_kids = false
declare_altered_content = false
# "filename" = hyphenated mp4 stem; "description" = "## YouTube Title" from md
title_source = filename
