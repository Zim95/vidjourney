[icons]
# Iconify API for searching and downloading SVG icons
api_search_url = https://api.iconify.design/search
api_download_url = https://api.iconify.design
icons_dir = pipeline/resources/icons
preferred_collections = simple-icons,logos,mdi,material-symbols
max_retries = 2

[pipeline]
# Shared executor pools — bounds total concurrency across all modules
# thread_workers: for I/O-bound tasks (LLM calls, manim subprocess, TTS, ffmpeg)
# process_workers: for CPU-bound tasks (compilation, code rendering, keyword extraction)
thread_workers = 4
process_workers = 4

[scenes]
scenes_dir = pipeline/scenes
default_scene_file = dsl_instructions.scene
dsl_grammar_file = src/dsl/renderer_dsl.lark

[render]
render_dir = pipeline/render
default_render_file = dsl_instructions.render.json
max_workers = 4

[manim]
python = .venv/bin/python
scene_file = src/renderer/manim/manim_runner.py
scene_class = ManimScene
quality = qh
preview = true
max_workers = 4

[ingestion]
max_workers = 4
# Table detection thresholds for per-document tuning
table_y_tolerance = 3.0
table_x_cluster_tolerance = 8.0
table_row_spacing_variance = 2.5
table_width_ratio = 0.75
table_score_threshold = 3.0

# Code detection thresholds for per-document tuning
code_sql_keyword_hits = 4
code_symbol_density_min = 0.015
code_symbol_density_strong = 0.03
code_min_line_count = 3
code_demote_symbol_density = 0.02
code_demote_sql_hits = 2
code_prose_min_line_length = 8
code_prose_connector_keywords = which,because,therefore,works,calculate,efficiently,load,find

# Code block rendering
code_blocks_dir = pipeline/sections/resources/code_blocks
code_block_images_dir = pipeline/sections/resources/code_block_images
code_block_font_size = 16
code_block_line_numbers = false
code_block_style = monokai
code_block_image_pad = 20

[grouping]
sections_dir = pipeline/sections
content_groups_dir = pipeline/groups/content_groups
timelines_dir = pipeline/groups/timelines
scene_files_dir = pipeline/groups/scene_files
storyboard_dir = pipeline/groups/storyboard

# Narration
piper_model = /Users/namahshrestha/.local/share/piper-voices/en_US-lessac-medium.onnx
piper_speaker_id = 0
piper_length_scale = 1.0
narration_dir = pipeline/groups/narration
output_dir = pipeline/output

# Canvas layout for DSL compiler
canvas_x_min = -5.0
canvas_x_max = 5.0
canvas_y_min = -3.0
canvas_y_max = 3.0
grid_max_cols = 4
shape_size = 1.0
animation_spawn_time = 0.5
animation_remove_time = 0.5

# Renderer
render_dir = pipeline/render
manim_video_dir = media/videos/manim_runner/1080p60

[ollama]
base_url = http://localhost:11434
chat_model = gemma4:e2b
max_retries = 3

[ml]
# Ollama endpoint for embeddings and default model name
ollama_url = http://localhost:11434/api/embeddings
embedding_model = nomic-embed-text
embedding_batch_size = 50

# Model training
models_dir = models
model_filename = code_rf.joblib
training_data_dir = src/ingestion/ml/training_code_snippets
n_estimators = 200
test_size = 0.2
random_state = 42

# Inference threshold for line-level code detection
code_line_threshold = 0.4
